<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#162b55">
  <meta name="description" content="接金币，接住更多金币，挑战最高分。">
  <title>接金币 | Catch the Coins</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="game-wrap" aria-label="接金币游戏">
      <header class="topbar">
        <div class="brand"><span class="brand-coin" aria-hidden="true">$</span><span>接金币</span></div>
        <div class="top-actions">
          <button class="icon-button" id="sound-button" type="button" aria-label="切换音效" aria-pressed="true">♫</button>
          <button class="icon-button" id="pause-button" type="button" aria-label="暂停游戏" disabled>Ⅱ</button>
        </div>
      </header>

      <div class="scorebar" aria-live="polite">
        <div><span class="label">得分</span><strong id="score">0000</strong></div>
        <div class="lives" aria-label="剩余生命"><span class="label">生命</span><span id="lives" class="hearts">♥ ♥ ♥</span></div>
      </div>

      <div class="playfield-shell">
        <canvas id="game-canvas" width="420" height="700" aria-label="游戏区域"></canvas>
        <div id="start-screen" class="game-overlay">
          <div class="overlay-art" aria-hidden="true">✦</div>
          <p class="overline">CATCH THE COINS</p>
          <h1>接住每一枚<br><em>闪闪金币</em></h1>
          <p class="instructions">按住屏幕左侧或右侧移动小玩家<br>也可以拖动角色来接金币</p>
          <button id="start-button" class="primary-button" type="button"><span>开始游戏</span><b aria-hidden="true">→</b></button>
        </div>
        <div id="pause-screen" class="game-overlay is-hidden">
          <div class="pause-mark" aria-hidden="true">Ⅱ</div>
          <p class="overline">PAUSED</p>
          <h2>休息一下</h2>
          <button id="resume-button" class="primary-button" type="button"><span>继续游戏</span><b aria-hidden="true">→</b></button>
        </div>
        <div id="game-over-screen" class="game-overlay is-hidden">
          <div class="overlay-art" aria-hidden="true">✧</div>
          <p class="overline">GAME OVER</p>
          <h2>这次接到 <strong id="final-score">0</strong> 分</h2>
          <p class="instructions">金币还在闪闪发光，<br>再来一次创造新纪录吧。</p>
          <button id="restart-button" class="primary-button" type="button"><span>重新开始</span><b aria-hidden="true">↻</b></button>
        </div>
      </div>
      <p class="control-hint"><span>←</span> 按住左右两侧移动 <span>→</span></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
